<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Благодарим за поръчката</title>

    <style>
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: aquamarine;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .thankyou-box {
            background-color: lightseagreen;
            padding: 50px;
            border-radius: 40px;
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        p {
            font-size: 22px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background-color: chartreuse;
            color: darkgreen;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }

        a:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>

    <div class="thankyou-box">
        <h1>Благодарим!</h1>
        <p>Вашата поръчка беше изпратена успешно.</p>
        <p>Ще се свържем с вас възможно най-скоро.</p>

        <a href="index.html">Обратно към сайта</a>
    </div>

</body>
</html>
